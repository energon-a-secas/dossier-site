<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sample HTML presentation</title>
  <style>
    body { margin: 0; padding: 32px; background: #eef2f6; color: #263247; font: 16px/1.5 system-ui; }
    [hidden] { display: none; }
    svg { display: block; width: 100%; max-width: 500px; margin: 24px 0; }
    button { padding: 12px 18px; font: inherit; }
    input { width: min(100%, 300px); }
  </style>
</head>
<body>
  <section id="first"><h1>Compare two runs</h1><p>The document keeps its own layout.</p></section>
  <section id="second" hidden>
    <h1>A chart with a control</h1>
    <svg viewBox="0 0 320 120" role="img" aria-label="Two run measurements">
      <rect x="0" y="10" width="180" height="30" fill="#6f6594" />
      <rect id="measurement" x="0" y="65" width="120" height="30" fill="#168675" />
    </svg>
    <label>Second run <input id="amount" type="range" min="0" max="300" value="120"></label>
  </section>
  <button type="button" id="next">Next page</button>
  <script>
    document.getElementById('next').addEventListener('click', function () {
      document.getElementById('first').hidden = true;
      document.getElementById('second').hidden = false;
    });
    document.getElementById('amount').addEventListener('input', function () {
      document.getElementById('measurement').setAttribute('width', this.value);
    });
    document.body.dataset.ready = 'true';
  </script>
</body>
</html>
