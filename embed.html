<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- This separate policy permits inline controls without relaxing the
       workspace policy. The parent enforces sandbox=allow-scripts. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML report preview</title>
</head>
<body>
  <script>
    // HTML_MAX_CHARS in js/embed-policy.js. This page cannot import it under its
    // own policy, so tests/embed-cap.test.mjs keeps the two numbers equal. The
    // 1024 is room for the policy head embedDocument() puts in front.
    var MAX_CHARS = 2000000;
    // Only the frame Dossier builds: sandbox="allow-scripts" gives an opaque origin
    // (self.origin === 'null'). A page that frames this file without a sandbox, or with
    // allow-same-origin, gets the real Dossier origin, and is refused before it can post
    // anything. GitHub Pages cannot send frame-ancestors, so this check is the boundary.
    var sealed = window.parent !== window && self.origin === 'null';
    // Defence in depth where supported: the immediate parent must be Dossier itself.
    if (sealed && location.ancestorOrigins && location.ancestorOrigins.length
        && location.ancestorOrigins[0] !== location.origin) sealed = false;
    if (sealed) {
      window.addEventListener('message', function receive(event) {
        if (event.source !== window.parent || event.data?.type !== 'dossier-embed-content'
            || typeof event.data.html !== 'string') return;
        window.removeEventListener('message', receive);
        if (event.data.html.length > MAX_CHARS + 1024) {
          // A sentence, not a blank frame: the frame is all the reader sees.
          var note = document.createElement('p');
          note.style.cssText = 'font: 16px/1.5 system-ui, sans-serif; margin: 24px; max-width: 60ch';
          note.textContent = 'This HTML report is ' + event.data.html.length.toLocaleString('en-US')
            + ' characters long, over the ' + MAX_CHARS.toLocaleString('en-US')
            + ' character limit Dossier opens. Open the file in its own browser tab, or split it into smaller reports.';
          document.body.appendChild(note);
          return;
        }
        document.open();
        document.write(event.data.html);
        document.close();
      });
      window.parent.postMessage({ type: 'dossier-embed-ready' }, '*');
    }
  </script>
</body>
</html>
